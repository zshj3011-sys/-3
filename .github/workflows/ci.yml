name: MedMind Nexus CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: 后端测试 (FastAPI + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medmind-backend

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: medmind-backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
          LLM_PROVIDER: mock
          DEMO_MODE: "true"
        run: |
          pytest tests/ -v --tb=short

  backend-lint:
    name: 后端代码风格 (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: |
          cd medmind-backend
          ruff check app/ tests/ --output-format=github || true

  frontend-validate:
    name: 前端 HTML 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML count
        run: |
          count=$(find MedMindNexus -name "*.html" -type f | wc -l)
          echo "HTML pages: $count"
          if [ "$count" -lt 18 ]; then
            echo "❌ 前端页面数应 ≥18, 当前 $count"
            exit 1
          fi
          echo "✅ 前端页面数符合预期"
      - name: Verify common assets
        run: |
          test -f MedMindNexus/assets/css/common.css
          test -f MedMindNexus/assets/js/api.js
          test -f MedMindNexus/sitemap.html
          echo "✅ 前端公共资源齐全"

  docker-build:
    name: Docker 镜像构建测试
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          cd medmind-backend
          docker build -t medmind-backend:ci-test .
      - name: Smoke test
        run: |
          docker run --rm -d -p 8000:8000 --name medmind-test medmind-backend:ci-test
          sleep 10
          curl -f http://localhost:8000/health || (docker logs medmind-test && exit 1)
          docker stop medmind-test
          echo "✅ Docker smoke test 通过"

  wechat-validate:
    name: 微信小程序结构校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify miniprogram structure
        run: |
          test -f wechat-miniprogram/app.json
          test -f wechat-miniprogram/app.js
          test -f wechat-miniprogram/project.config.json
          for p in home triage depts report meds health; do
            test -f wechat-miniprogram/pages/$p/$p.wxml || (echo "❌ pages/$p/$p.wxml 缺失" && exit 1)
            test -f wechat-miniprogram/pages/$p/$p.js || (echo "❌ pages/$p/$p.js 缺失" && exit 1)
          done
          echo "✅ 微信小程序 6 页面齐全"
